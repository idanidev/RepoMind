# Tests unitarios en un simulador de iPhone, sin Mac. Arranca con cada push a las ramas de
# trabajo y con cada PR a main; a mano desde Actions en cuanto el fichero esté en main. No
# bloquea la subida a TestFlight: esa la hace testflight.yml por su cuenta.
#
# Solo el target RepoMindTests: los UI tests arrancan la app entera y en un runner sin cuenta
# de iCloud ni micrófono no dicen nada fiable.

name: Tests

on:
  push:
    branches:
      - main
      - redesign/home-oled
      - claude/testflight
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit:
    name: Tests unitarios (simulador)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26, el más nuevo del runner
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No hay Xcode 26 en el runner. Hay:"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Simulador de iPhone
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"] if phones else "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::No hay simuladores de iPhone en el runner"; xcrun simctl list devices available; exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: xcodebuild test
        run: |
          set +e
          xcodebuild test \
            -project RepoMind.xcodeproj -scheme RepoMind \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RepoMindTests \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/tests.log" 2>&1
          estado=$?
          set -e
          # Solo lo que importa en pantalla; el registro entero va al artefacto.
          grep -E "error:|Test Suite '.*' (passed|failed)|Executed [0-9]+ tests|\*\* TEST" "$RUNNER_TEMP/tests.log" || true
          exit $estado

      - name: Registro y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/Tests.xcresult
          if-no-files-found: ignore
