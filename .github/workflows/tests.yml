# Tests unitarios en un simulador de iPhone, sin Mac. Arranca con cada push a las ramas de
# trabajo y con cada PR a main; a mano desde Actions en cuanto el fichero esté en main. No
# bloquea la subida a TestFlight: esa la hace testflight.yml por su cuenta.
#
# Solo el target RepoMindTests: los UI tests arrancan la app entera y en un runner sin cuenta
# de iCloud ni micrófono no dicen nada fiable.

name: Tests

on:
  push:
    branches:
      - main
      - redesign/home-oled
      - claude/testflight
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit:
    name: Tests unitarios (simulador)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26, el más nuevo del runner
        run: |
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$app" ]; then
            echo "::error::No hay Xcode 26 en el runner. Hay:"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Simulador de iPhone
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"] if phones else "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::No hay simuladores de iPhone en el runner"; xcrun simctl list devices available; exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: xcodebuild test
        # Sin paralelo: Xcode clona el simulador por cada worker y, en un runner justo de recursos,
        # un clon no llega a arrancar la app ("server died") y un test sin culpa se marca fallado.
        run: |
          touch "$RUNNER_TEMP/tests.started"
          set +e
          xcodebuild test \
            -project RepoMind.xcodeproj -scheme RepoMind \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:RepoMindTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            > "$RUNNER_TEMP/tests.log" 2>&1
          estado=$?
          set -e
          # Solo lo que importa en pantalla; el registro entero va al artefacto. Xcode 26 escribe
          # "Test case ... passed/failed" y "Test run with N tests ...", no las líneas clásicas.
          grep -iE "error:|error \(|failed|Test run with|Executed [0-9]+ tests|\*\* TEST" "$RUNNER_TEMP/tests.log" \
            | grep -v "warning:" | head -80 || true
          if [ "$estado" -ne 0 ]; then
            echo "::group::Últimas 150 líneas del registro"
            tail -n 150 "$RUNNER_TEMP/tests.log"
            echo "::endgroup::"
            # Un proceso del simulador que muere deja su informe en el DiagnosticReports del Mac
            # anfitrión; el xcresult exporta logs, pero no siempre el .ips.
            echo "::group::Informes de crash"
            find "$HOME/Library/Logs/DiagnosticReports" -type f -name "RepoMind*" -newer "$RUNNER_TEMP/tests.started" \
              -o -type f -name "xctest*" -newer "$RUNNER_TEMP/tests.started" 2>/dev/null \
              | while read -r f; do echo "--- $f"; head -c 20000 "$f"; echo; done
            xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/Tests.xcresult" \
              --output-path "$RUNNER_TEMP/diagnostics" 2>/dev/null || true
            echo "--- contenido exportado del xcresult:"
            find "$RUNNER_TEMP/diagnostics" -type f 2>/dev/null | head -n 40
            find "$RUNNER_TEMP/diagnostics" -type f \( -name "*.crash" -o -name "*.ips" \) 2>/dev/null \
              | while read -r f; do echo "--- $f"; head -c 20000 "$f"; echo; done
            echo "::endgroup::"
          fi
          exit $estado

      - name: Empaquetar resultados
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Tests.xcresult" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Tests.xcresult" "$RUNNER_TEMP/Tests.xcresult.zip"
          fi

      - name: Registro y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/Tests.xcresult.zip
          if-no-files-found: ignore
